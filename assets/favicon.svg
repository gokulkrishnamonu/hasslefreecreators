<svg width="680" height="170" viewBox="0 0 680 170" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HassleFree Creators logo</title>
<desc>Purple and teal logo for HassleFree Creators featuring a connected node network icon and bold wordmark.</desc>
<defs>
<style>
  .brand1{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#26215C;}
  .brand2{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#0F6E56;}
</style>
</defs>

<!-- Icon: rounded square with connected node network -->
<rect x="35" y="35" width="100" height="100" rx="24" fill="#3C3489"/>

<!-- connecting lines -->
<line x1="65" y1="105" x2="85" y2="65" stroke="#5DCAA5" stroke-width="4" stroke-linecap="round"/>
<line x1="85" y1="65" x2="107" y2="97" stroke="#5DCAA5" stroke-width="4" stroke-linecap="round"/>
<line x1="65" y1="105" x2="107" y2="97" stroke="#5DCAA5" stroke-width="4" stroke-linecap="round"/>
<line x1="85" y1="65" x2="85" y2="113" stroke="#5DCAA5" stroke-width="4" stroke-linecap="round"/>

<!-- nodes -->
<circle cx="85" cy="65" r="9" fill="#FFFFFF"/>
<circle cx="65" cy="105" r="9" fill="#1D9E75"/>
<circle cx="107" cy="97" r="9" fill="#1D9E75"/>
<circle cx="85" cy="113" r="7" fill="#FFFFFF"/>

<!-- Wordmark -->
<text x="160" y="80" font-size="42" class="brand1">Hassle<tspan class="brand2">Free</tspan></text>
<text x="160" y="125" font-size="34" class="brand1" letter-spacing="1">Creators</text>

</svg>
